<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library</title>
    <style>
        :root { --bg:#faf6f0; --ink:#2b2118; --muted:#8a7a6a; --line:#eadfd1; --brand:#7c4a2d; --ok:#2f7d4f; --warn:#b4531a; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Helvetica,Arial,sans-serif; }
        .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
        .hero { padding-top: 44px; padding-bottom: 24px; text-align: center; }
        h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 40px; letter-spacing: .5px; }
        header p { margin: 8px 0 0; color: var(--muted); }
        form { display:flex; gap:10px; max-width: 560px; margin: 26px auto 0; }
        input { flex:1; padding: 13px 16px; border:1px solid var(--line); border-radius: 999px; font-size:15px; background:#fff; }
        button { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:999px; padding: 11px 18px; font-size:14px; cursor:pointer; background:var(--brand); color:#fff; }
        button:hover { opacity:.92; }
        svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px; padding: 34px 0 60px; align-items:start; }
        .item { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow: 0 6px 18px rgba(80,50,20,.06); }
        .cover { height: 170px; border-radius: 4px 12px 12px 4px; padding: 16px 14px 14px 22px; color:#fff; display:flex; flex-direction:column; justify-content:space-between; position:relative; box-shadow: inset 8px 0 0 rgba(0,0,0,.18); }
        .cover .t { padding-right: 36px; font-family: Georgia, serif; font-size: 19px; line-height: 1.2; font-weight: 700; }
        .cover .a { margin-top: 8px; font-size: 12px; opacity: .85; }
        .cover svg { opacity: .8; width: 22px; height: 22px; }
        .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; }
        .badge svg { width:13px; height:13px; }
        .badge.ok { background:#e6f4ea; color:var(--ok); }
        .badge.no { background:#fdeee3; color:var(--warn); }
        button.ghost { background:#f3ebe2; color:var(--brand); padding: 8px 12px; font-size: 13px; }
        button.ai { background:#efe6f7; color:#5b3d8f; padding: 8px 12px; font-size: 13px; width:100%; }
        button.ai svg { width:15px; height:15px; }
        .summary { font-size:13px; line-height:1.55; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
        button.del { position:absolute; top:8px; right:8px; padding:6px; border-radius:8px; background:rgba(255,255,255,.18); color:#fff; }
        button.del:hover { background:rgba(255,255,255,.32); }
        .filters { display:flex; justify-content:center; gap:8px; margin-top:22px; flex-wrap:wrap; }
        button.tab { background:#fff; color:var(--brand); border:1px solid var(--line); padding:8px 16px; font-size:13px; }
        button.tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
        .topbar { display:flex; justify-content:flex-end; align-items:center; gap:10px; padding-top:16px; min-height:56px; font-size:14px; }
        .topbar .who { color:var(--muted); }
        button.link { background:#fff; color:var(--brand); border:1px solid var(--line); padding:8px 16px; font-size:13px; }
        #authForm { display:none; flex-direction:column; gap:10px; max-width:360px; margin:6px auto 0; background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 6px 18px rgba(80,50,20,.06); }
        #authForm input { border-radius:12px; }
        #authForm .btns { display:flex; gap:8px; }
        #authForm .btns button { flex:1; }
        button.secondary { background:#f3ebe2; color:var(--brand); }
        .msg { font-size:13px; color:var(--warn); text-align:center; min-height:16px; }
        .empty { grid-column: 1 / -1; text-align:center; color:var(--muted); padding: 30px; }
    </style>
</head>
<body>
<header class="wrap hero">
    <div class="topbar" id="topbar"></div>
    <h1>The Library</h1>
    <p>Browse, borrow and return books</p>
    <form id="authForm">
        <div class="msg" id="authMsg"></div>
        <div class="msg" style="color:var(--muted)">Demo site: please don't use a real password.</div>
        <input id="userInput" placeholder="Username" autocomplete="username" required>
        <input id="passInput" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required>
        <div class="btns">
            <button type="submit" id="loginBtn">Log in</button>
            <button type="button" id="signupBtn" class="secondary">Create account</button>
        </div>
    </form>
    <form id="addForm">
        <input id="titleInput" placeholder="Add a new book title..." required>
        <button type="submit" id="addBtn"></button>
    </form>
    <div class="filters" id="filters"></div>
</header>
<main class="wrap"><div class="grid" id="list"></div></main>

<script>
    const ICONS = {
        book:   '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
        check:  '<circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/>',
        clock:  '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        borrow: '<path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>',
        back:   '<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>',
        plus:   '<path d="M12 5v14"/><path d="M5 12h14"/>',
        trash:  '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
        sparkle:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>'
    };
    const COLORS = ['#7c4a2d','#2f5d62','#6b3f69','#8a5a00','#364f6b','#7a2e3a'];
    function icon(n) { return '<svg viewBox="0 0 24 24">' + ICONS[n] + '</svg>'; }
    document.getElementById('addBtn').innerHTML = icon('plus') + 'Add';
    const list = document.getElementById('list');

    let demo = false;
    let filter = 'all';
    let me = null;
    let mineIds = new Set();

    function showAuth(message) {
        const form = document.getElementById('authForm');
        form.style.display = 'flex';
        document.getElementById('authMsg').textContent = message || '';
        document.getElementById('userInput').focus();
    }
    function hideAuth() {
        document.getElementById('authForm').style.display = 'none';
        document.getElementById('authMsg').textContent = '';
        document.getElementById('passInput').value = '';
    }

    function renderTopbar() {
        const bar = document.getElementById('topbar');
        bar.innerHTML = '';
        if (me) {
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = 'Hi, ' + me;
            const out = document.createElement('button');
            out.className = 'link';
            out.textContent = 'Log out';
            out.onclick = async () => {
                await fetch('/logout', { method: 'POST' });
                me = null;
                if (filter === 'mine') filter = 'all';
                await refresh();
            };
            bar.appendChild(who);
            bar.appendChild(out);
        } else {
            const inn = document.createElement('button');
            inn.className = 'link';
            inn.textContent = 'Log in / Sign up';
            inn.onclick = () => showAuth('');
            bar.appendChild(inn);
        }
        document.getElementById('addForm').style.display = (!demo && me) ? 'flex' : 'none';
    }

    function renderFilters(books) {
        const counts = {
            all: books.length,
            available: books.filter(b => b.available).length,
            borrowed: books.filter(b => !b.available).length,
            mine: mineIds.size
        };
        const labels = { all: 'All', available: 'Available', borrowed: 'Borrowed', mine: 'My books' };
        const keys = me ? ['all', 'available', 'borrowed', 'mine'] : ['all', 'available', 'borrowed'];
        const box = document.getElementById('filters');
        box.innerHTML = '';
        for (const key of keys) {
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'tab' + (filter === key ? ' active' : '');
            tab.textContent = labels[key] + ' (' + counts[key] + ')';
            tab.onclick = () => { filter = key; load(); };
            box.appendChild(tab);
        }
    }

    async function checkMe() {
        try {
            const r = await (await fetch('/me')).json();
            me = r.loggedIn ? r.username : null;
        } catch (e) { me = null; }
    }

    async function refresh() {
        renderTopbar();
        await load();
    }

    async function init() {
        try {
            const c = await (await fetch('/config')).json();
            demo = c.demo;
        } catch (e) {}
        if (demo) {
            document.querySelector('header p').textContent = 'Browse, borrow and return books · Demo mode';
        }
        await checkMe();
        await refresh();
    }

    async function load() {
        const res = await fetch('/books');
        const allBooks = await res.json();
        mineIds = new Set();
        if (me) {
            try {
                const r = await fetch('/books/mine');
                if (r.ok) (await r.json()).forEach(b => mineIds.add(b.id));
            } catch (e) {}
        }
        renderFilters(allBooks);
        const books = allBooks.filter(b => {
            if (filter === 'all') return true;
            if (filter === 'available') return b.available;
            if (filter === 'borrowed') return !b.available;
            return mineIds.has(b.id);
        });
        list.innerHTML = '';
        if (books.length === 0) {
            const label = filter === 'mine' ? 'You have not borrowed any books yet'
                : (allBooks.length === 0 ? 'No books yet' : 'No ' + filter + ' books');
            list.innerHTML = '<div class="empty">' + label + '</div>';
            return;
        }
        for (const b of books) {
            const isMine = mineIds.has(b.id);
            const item = document.createElement('div');
            item.className = 'item';

            const cover = document.createElement('div');
            cover.className = 'cover';
            cover.style.background = COLORS[b.id % COLORS.length];
            const t = document.createElement('div');
            t.className = 't';
            t.textContent = b.title;

            const a = document.createElement('div');
            a.className = 'a';
            a.textContent = b.author || '';

            const head = document.createElement('div');
            head.appendChild(t);
            head.appendChild(a);
            cover.appendChild(head);
            cover.insertAdjacentHTML('beforeend', icon('book'));

            const del = document.createElement('button');
            del.className = 'del';
            del.title = 'Delete';
            del.innerHTML = icon('trash');
            del.onclick = async () => {
                await fetch('/books/' + b.id, { method: 'DELETE' });
                load();
            };
            if (!demo && me) cover.appendChild(del);

            const row = document.createElement('div');
            row.className = 'row';
            const badge = document.createElement('span');
            badge.className = 'badge ' + (b.available ? 'ok' : 'no');
            const badgeText = b.available ? 'Available' : (isMine ? 'Borrowed by you' : 'Borrowed');
            badge.innerHTML = icon(b.available ? 'check' : 'clock') + badgeText;
            row.appendChild(badge);

            if (b.available || isMine) {
                const btn = document.createElement('button');
                btn.className = 'ghost';
                btn.innerHTML = icon(b.available ? 'borrow' : 'back') + (b.available ? 'Borrow' : 'Return');
                btn.onclick = async () => {
                    if (!me) { showAuth('Please log in to borrow books'); return; }
                    const r = await fetch('/books/' + encodeURIComponent(b.title) + '/' + (b.available ? 'borrow' : 'return'), { method: 'PUT' });
                    if (r.status === 401) { me = null; await refresh(); showAuth('Your session ended, please log in again'); return; }
                    load();
                };
                row.appendChild(btn);
            }

            const ai = document.createElement('button');
            ai.className = 'ai';
            ai.innerHTML = icon('sparkle') + 'AI summary';
            const box = document.createElement('div');
            box.className = 'summary';
            box.style.display = 'none';
            ai.onclick = async () => {
                if (box.style.display === 'block') { box.style.display = 'none'; return; }
                box.style.display = 'block';
                box.textContent = 'Thinking...';
                try {
                    const r = await fetch('/books/' + b.id + '/summary');
                    if (!r.ok) throw new Error('failed');
                    const data = await r.json();
                    box.textContent = data.summary;
                } catch (e) {
                    box.textContent = 'Summary is unavailable right now. Please try again.';
                }
            };

            item.appendChild(cover);
            item.appendChild(row);
            item.appendChild(ai);
            item.appendChild(box);
            list.appendChild(item);
        }
    }

    async function doLogin(username, password) {
        const r = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username, password })
        });
        return r.ok;
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('userInput').value.trim();
        const password = document.getElementById('passInput').value;
        if (await doLogin(username, password)) {
            hideAuth();
            await checkMe();
            await refresh();
        } else {
            document.getElementById('authMsg').textContent = 'Wrong username or password';
        }
    });

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const username = document.getElementById('userInput').value.trim();
        const password = document.getElementById('passInput').value;
        const msg = document.getElementById('authMsg');
        if (!username || !password) { msg.textContent = 'Enter a username and password first'; return; }
        const r = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (!r.ok) {
            let data = {};
            try { data = await r.json(); } catch (e) {}
            msg.textContent = data.error || 'Could not create the account';
            return;
        }
        if (await doLogin(username, password)) {
            hideAuth();
            await checkMe();
            await refresh();
        }
    });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('titleInput');
        await fetch('/books', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: input.value.trim() }) });
        input.value = '';
        load();
    });
    init();
</script>
</body>
</html>
